    repos:
      github.com/cessda/cessda.ai.mcp.cdc find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.chili_adventurous_groundhog.sh
        container: qc.doc_isabelline_peppy_cheetah
      github.com/cessda/cessda.ai.mcp.cdc git:
        commands:
        - /usr/bin/env sh .sqa/script.pansy_candid_spren.sh
        container: qc.doc_goldenrod_grateful_thrush
      github.com/cessda/cessda.ai.mcp.cdc markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.beige_impulsive_panther.sh
        container: qc.doc_marina_alert_gazelle
